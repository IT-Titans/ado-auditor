trigger:
  branches:
    include:
      - dev
      - main
  paths:
    include:
      - backend/**
      - frontend/**
# NOTE: this block does nothing on Azure Repos. YAML pr: triggers are honoured for
# GitHub and Bitbucket only; for Azure Repos Git the gate is a Build Validation
# branch policy, configured per branch under Repos > Branches > Branch policies.
# It is kept because this repository is also mirrored to github.com/IT-Titans, where
# the trigger would apply.
#
# The push guards below are what the branch policy relies on: a policy-triggered run
# reports Build.Reason = PullRequest, so the images are built but never published.
pr:
  branches:
    include:
      - dev
      - main
  paths:
    include:
      - backend/**
      - frontend/**
variables:
  sha: $(Build.SourceVersion)
  tag: $(Build.SourceBranchName)-$(Build.BuildId)

stages:

# Run the backend test suite and publish results and coverage
#
# The SDK version comes from global.json at the repository root, which is the
# single source of truth for the toolchain. The pin here only selects the feature
# band to install on the agent.
- stage: test
  displayName: Test
  jobs:
  - job: backend_tests
    displayName: Backend
    pool: { vmImage: 'ubuntu-latest' }
    steps:
      - task: UseDotNet@2
        displayName: Install .NET SDK 10
        inputs:
          packageType: sdk
          version: '10.0.x'
      - script: >
          dotnet test backend/AdoExport.Api.sln
          -c Release
          --settings backend/coverage.runsettings
          --logger trx
          --results-directory "$(Agent.TempDirectory)/testresults"
          --collect:"XPlat Code Coverage"
        displayName: Run backend tests
      # succeededOrFailed, because a failing test run is exactly when the report matters.
      - task: PublishTestResults@2
        displayName: Publish test results
        condition: succeededOrFailed()
        inputs:
          testResultsFormat: VSTest
          testResultsFiles: '**/*.trx'
          searchFolder: '$(Agent.TempDirectory)/testresults'
          failTaskOnFailedTests: true
      - task: PublishCodeCoverageResults@2
        displayName: Publish code coverage
        condition: succeededOrFailed()
        inputs:
          summaryFileLocation: '$(Agent.TempDirectory)/testresults/**/coverage.cobertura.xml'

      # ReportGenerator merges the per-project reports before anything is judged on
      # them. Each test project emits its own file covering overlapping assemblies, and
      # a line counts as covered if any project reaches it. Reading one file per
      # assembly undercounts: on 12.11.2026 that difference was 14 points for
      # AdoExport.Auditing.
      - script: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          "$HOME/.dotnet/tools/reportgenerator" \
            "-reports:$(Agent.TempDirectory)/testresults/**/coverage.cobertura.xml" \
            "-targetdir:$(Agent.TempDirectory)/coverage" \
            "-reporttypes:Cobertura"
        displayName: Merge coverage reports
        condition: succeededOrFailed()

      - task: PowerShell@2
        displayName: Enforce coverage minimum
        condition: succeededOrFailed()
        inputs:
          pwsh: true
          filePath: backend/Check-Coverage.ps1
          arguments: -ReportPath "$(Agent.TempDirectory)/coverage/Cobertura.xml" -Minimum 90

  - job: frontend_tests
    displayName: Frontend
    pool: { vmImage: 'ubuntu-latest' }
    steps:
      - task: NodeTool@0
        displayName: Install Node 22
        inputs:
          versionSpec: '22.x'
      - script: corepack enable && pnpm install --frozen-lockfile
        workingDirectory: frontend
        displayName: Install dependencies
      # Type check and lint run before the tests, so a failure fails the Test stage.
      # Lint warnings do not fail the step, only errors do.
      - script: pnpm typecheck
        workingDirectory: frontend
        displayName: Type check frontend
      - script: pnpm lint
        workingDirectory: frontend
        displayName: Lint frontend
      # vitest.config.ts carries its own 90 % threshold for the logic set, so this step
      # fails on its own when coverage drops. Vue components are outside that set by
      # decision: most of their body is template rendering rather than logic.
      - script: pnpm vitest run --coverage
        workingDirectory: frontend
        displayName: Run frontend tests
      - task: PublishTestResults@2
        displayName: Publish frontend test results
        condition: succeededOrFailed()
        inputs:
          testResultsFormat: JUnit
          testResultsFiles: 'frontend/test-results/junit.xml'
          failTaskOnFailedTests: true
      - task: PublishCodeCoverageResults@2
        displayName: Publish frontend coverage
        condition: succeededOrFailed()
        inputs:
          summaryFileLocation: 'frontend/coverage/cobertura-coverage.xml'

  # The scripts that publish a release to GitHub and check it for drift. They run after
  # the production deployment, where a defect in them would only show once a release is
  # already out, so they are tested here against local git repositories.
  - job: mirror_tests
    displayName: Mirror scripts
    pool: { vmImage: 'ubuntu-latest' }
    steps:
      - task: PowerShell@2
        displayName: Run the mirror script tests
        inputs:
          pwsh: true
          targetType: inline
          script: |
            $pester = Get-Module -ListAvailable Pester | Where-Object { $_.Version.Major -ge 5 } | Sort-Object Version -Descending | Select-Object -First 1
            if (-not $pester) {
              Install-Module Pester -RequiredVersion 5.7.1 -Force -Scope CurrentUser -SkipPublisherCheck
              $pester = Get-Module -ListAvailable Pester | Where-Object { $_.Version -eq '5.7.1' } | Select-Object -First 1
            }
            Import-Module $pester.Path -Force
            $configuration = New-PesterConfiguration
            $configuration.Run.Path = 'mirror/tests'
            $configuration.Run.Exit = $true
            $configuration.Output.Verbosity = 'Detailed'
            $configuration.TestResult.Enabled = $true
            $configuration.TestResult.OutputFormat = 'NUnitXml'
            $configuration.TestResult.OutputPath = '$(Agent.TempDirectory)/mirror-tests.xml'
            Invoke-Pester -Configuration $configuration
      - task: PublishTestResults@2
        displayName: Publish mirror script test results
        condition: succeededOrFailed()
        inputs:
          testResultsFormat: NUnit
          testResultsFiles: '$(Agent.TempDirectory)/mirror-tests.xml'
          failTaskOnFailedTests: true

# Build backend and frontend images, push to remote container repository (#1526)
- stage: build
  displayName: Build and Push
  dependsOn: test
  jobs:
  - job: backend
    displayName: Backend
    pool: { vmImage: 'ubuntu-latest' }
    steps:
      # Build backend
      #
      # The image is told which branch it is built from. The application loads
      # appsettings.branch.<branch>.json when there is one, so an image built from main,
      # the only kind deployed to production, runs with the production settings kept in
      # backend/src/AdoExport.Api/appsettings.branch.main.json. For a pull request the
      # value is "merge", for which no file exists.
      - task: Docker@2
        inputs:
          command: build
          Dockerfile: backend/Dockerfile
          repository: $(repoBackend)
          arguments: --build-arg ADOAUDITOR_BUILD_BRANCH=$(Build.SourceBranchName)
          tags: |
            $(sha)
            $(tag)
            adoexport.api
          containerRegistry: ado-acr
      # A pull request build validates, it does not publish. Without this guard a PR
      # would overwrite the static adoexport.api tag in the registry with an
      # unreviewed image.
      - task: Docker@2
        condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
        inputs:
          command: push
          repository: $(repoBackend)
          tags: |
            $(sha)
            $(tag)
            adoexport.api
          containerRegistry: ado-acr
        displayName: Push backend image

  - job: frontend
    displayName: Frontend
    pool: { vmImage: 'ubuntu-latest' }
    steps:
      # Build frontend
      - task: Docker@2
        inputs:
          command: build
          Dockerfile: frontend/Dockerfile
          repository: $(repoFrontend)
          tags: |
            $(sha)
            $(tag)
            adoexport.app
          containerRegistry: ado-acr
      # Same here: validate on a pull request, publish only on dev and main.
      - task: Docker@2
        condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
        inputs:
          command: push
          repository: $(repoFrontend)
          tags: |
            $(sha)
            $(tag)
            adoexport.app
          containerRegistry: ado-acr
        displayName: Push frontend image

# Deploy new images to development App Services (#1526)
- stage: deploy_dev
  displayName: Deploy to Dev Apps
  dependsOn: build
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/dev'))
  jobs:
  # Deploy backend
  - deployment: DeployBackend
    displayName: Deploy Backend
    environment: dev-backend
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureWebAppContainer@1
            displayName: Deploy backend container
            inputs:
              azureSubscription: ado-azure-resource-manager
              appName: $(backendDevAppName)
              containers: |
                $(acrLoginServer)/$(repoBackend):$(sha)
  # Deploy frontend
  - deployment: DeployFrontend
    displayName: Deploy Frontend
    environment: dev-frontend
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureWebAppContainer@1
            displayName: Deploy frontend container
            inputs:
              azureSubscription: ado-azure-resource-manager
              appName: $(frontendDevAppName)
              containers: |
                $(acrLoginServer)/$(repoFrontend):$(sha)

# Deploy new images to production App Services (#1913)
- stage: deploy_prod
  displayName: Deploy to Prod Apps
  dependsOn: build
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  # Deploy backend
  - deployment: DeployBackend
    displayName: Deploy Backend
    environment: prod-backend
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureWebAppContainer@1
            displayName: Deploy backend container
            inputs:
              azureSubscription: ado-azure-resource-manager
              appName: $(backendProdAppName)
              containers: |
                $(acrLoginServer)/$(repoBackend):$(sha)
  # Deploy frontend
  - deployment: DeployFrontend
    displayName: Deploy Frontend
    environment: prod-frontend
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureWebAppContainer@1
            displayName: Deploy frontend container
            inputs:
              azureSubscription: ado-azure-resource-manager
              appName: $(frontendProdAppName)
              containers: |
                $(acrLoginServer)/$(repoFrontend):$(sha)

# Keep the public repository identical to what runs in production
#
# github.com/IT-Titans/ado-auditor holds one snapshot commit per release. This stage
# publishes the release that was just deployed and then checks that GitHub holds its
# tree. See docs/development/github-mirror.md.
#
# It comes after the production deployment and nothing depends on it. A red run here
# does not mean that the deployment failed, and it cannot hold back or undo one. It
# means that the published source is not the source of what is running, which under
# the AGPL has to be put right.
- stage: mirror
  displayName: Publish to GitHub
  dependsOn: deploy_prod
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - job: mirror
    displayName: Publish the release and check for drift
    pool: { vmImage: 'ubuntu-latest' }
    steps:
      # The whole history, not a shallow clone: the publish step compares what GitHub
      # holds with every earlier state of this branch before it adds to it.
      - checkout: self
        fetchDepth: 0
        persistCredentials: false
      # Skipped with a warning as long as no deploy key is set. The three variables are
      # set on the pipeline, the key as a secret; none of them is kept in this file.
      - task: PowerShell@2
        displayName: Publish the release to GitHub
        inputs:
          pwsh: true
          filePath: mirror/Publish-MirrorSnapshot.ps1
          arguments: -Commit $(Build.SourceVersion)
        env:
          MIRROR_DEPLOY_KEY_BASE64: $(mirrorDeployKeyBase64)
          MIRROR_AUTHOR_NAME: $(mirrorAuthorName)
          MIRROR_AUTHOR_EMAIL: $(mirrorAuthorEmail)
      # Runs whatever the step before did, and needs no credential: the repository is
      # public. This is the step that turns "not published" into a red stage.
      - task: PowerShell@2
        displayName: Check that GitHub holds what was deployed
        condition: succeededOrFailed()
        inputs:
          pwsh: true
          filePath: mirror/Test-MirrorDrift.ps1
          arguments: -Commit $(Build.SourceVersion)